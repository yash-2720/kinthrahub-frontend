<h2 mat-dialog-title>Run New Payroll</h2>

<mat-dialog-content>

  <form [formGroup]="payrollForm">

    <mat-form-field appearance="outline">
      <mat-label>Payroll Month</mat-label>

      <input
        matInput
        type="number"
        formControlName="payrollMonth"
        placeholder="Enter month (1-12)"
      />

      @if (
        payrollForm.get('payrollMonth')?.invalid &&
        payrollForm.get('payrollMonth')?.touched
      ) {
        <mat-error>
          Payroll month is required.
        </mat-error>
      }

    </mat-form-field>


    <mat-form-field appearance="outline">
      <mat-label>Payroll Year</mat-label>

      <input
        matInput
        type="number"
        formControlName="payrollYear"
        placeholder="Enter year"
      />

      @if (
        payrollForm.get('payrollYear')?.invalid &&
        payrollForm.get('payrollYear')?.touched
      ) {
        <mat-error>
          Payroll year is required.
        </mat-error>
      }

    </mat-form-field>

  </form>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">
    Cancel
  </button>

  <button
    mat-raised-button
    color="primary"
    type="button"
    [disabled]="payrollForm.invalid"
    (click)="continue()">
    Continue
  </button>

</mat-dialog-actions>
