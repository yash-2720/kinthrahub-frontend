<h2 mat-dialog-title>Payroll Completed</h2>

<mat-dialog-content>

  <p>
    Payroll for
    <strong>
      {{ data.payrollMonth }}/{{ data.payrollYear }}
    </strong>
    has been processed successfully.
  </p>

  <div class="payroll-summary">

    <div class="summary-item">
      <span>Payroll Run ID</span>
      <strong>{{ data.payrollRunId }}</strong>
    </div>

    <div class="summary-item">
      <span>Processed Requests</span>
      <strong>{{ data.processRequests }}</strong>
    </div>

    <div class="summary-item">
      <span>Skipped Requests</span>
      <strong>{{ data.skippedRequests }}</strong>
    </div>

    <div class="summary-item">
      <span>Total Donation Amount</span>
      <strong>₹{{ data.totalDonationAmount }}</strong>
    </div>

  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-raised-button
    color="primary"
    (click)="close()">
    OK
  </button>

</mat-dialog-actions>
