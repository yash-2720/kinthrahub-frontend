<h2 mat-dialog-title>Update Application User</h2>

<mat-dialog-content>

  @if (appUserData) {

    <div class="details-grid">

      <div class="detail-item">
        <span class="label">User ID : </span>
        <span class="value">{{ appUserData.userId }}</span>
      </div>

      <div class="detail-item">
        <span class="label">Username : </span>
        <span class="value">{{ appUserData.username }}</span>
      </div>

      <div class="detail-item">
        <span class="label">Employee ID : </span>
        <span class="value">{{ appUserData.employeeId }}</span>
      </div>

      <div class="detail-item">
        <span class="label">Employee Name : </span>
        <span class="value">{{ appUserData.employeeName }}</span>
      </div>

    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Role</mat-label>

      <mat-select [(value)]="appUserData.roleId">

        @for (role of roles; track role.roleId) {
          <mat-option [value]="role.roleId">
            {{ role.roleName }}
          </mat-option>
        }

      </mat-select>
    </mat-form-field>

  } @else {

    <div class="loading-container">
      <mat-spinner diameter="45"></mat-spinner>
    </div>

  }

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button mat-button mat-dialog-close>
    Cancel
  </button>

  <button
    mat-raised-button
    color="primary"
    [disabled]="appUserData?.roleId === originalRoleId"
    (click)="updateApplicationUser()">

    Update

</button>

</mat-dialog-actions>
