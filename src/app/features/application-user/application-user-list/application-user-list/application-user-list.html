<mat-form-field appearance="outline">
  <mat-label>Search User</mat-label>

  <input
    matInput
    placeholder="Search by ID, Number, Name or Email"
    [(ngModel)]="search"
    (keyup)="onSearch()"
  />
</mat-form-field>
<!-- Loading Spinner -->
<div class="loading-container" *ngIf="isLoading">
  <mat-spinner diameter="50"></mat-spinner>
</div>
<!-- Table -->
<div *ngIf="!isLoading && appUsers.length > 0">
  <table mat-table [dataSource]="appUsers" class="mat-elevation-z8">
    <!-- All your existing columns -->
    <ng-container matColumnDef="userId">
      <th mat-header-cell *matHeaderCellDef>User ID</th>
      <td mat-cell *matCellDef="let user">
        {{ user.userId }}
      </td>
    </ng-container>

    <!-- Username -->
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef>Username</th>
      <td mat-cell *matCellDef="let user">
        {{ user.username }}
      </td>
    </ng-container>

    <!-- Employee ID -->
    <ng-container matColumnDef="employeeId">
      <th mat-header-cell *matHeaderCellDef>Employee ID</th>
      <td mat-cell *matCellDef="let user">
        {{ user.employeeId }}
      </td>
    </ng-container>

    <!-- Employee Name -->
    <ng-container matColumnDef="employeeName">
      <th mat-header-cell *matHeaderCellDef>Employee Name</th>
      <td mat-cell *matCellDef="let user">
        {{ user.employeeName }}
      </td>
    </ng-container>

    <!-- Role -->
    <ng-container matColumnDef="roleName">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let user">
        {{ user.roleName }}
      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let user">
        <button mat-raised-button color="primary" (click) = openViewDialog(user.userId)>View</button>
         
        <button mat-icon-button (click)="openEditAppUser(user.userId)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="openEditAppUser(user.userId)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
      <!-- <td mat-cell *matCellDef="let employee">
        <button mat-icon-button (click)="openViewDialog(employee.employeeId)">
          <mat-icon>visibility</mat-icon>
       
      </td> -->
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="totalElements"
    [pageIndex]="page"
    [pageSize]="size"
    [pageSizeOptions]="[3, 5, 10, 20]"
    (page)="onPageChange($event)"
  >
  </mat-paginator>
</div>

<!-- No Results -->
<div class="no-data" *ngIf="!isLoading && appUsers.length === 0">
  <h3>No application users found.</h3>
   <p *ngIf="search.trim()">
    No records match "<strong>{{ search }}</strong>".
  </p>
</div>
