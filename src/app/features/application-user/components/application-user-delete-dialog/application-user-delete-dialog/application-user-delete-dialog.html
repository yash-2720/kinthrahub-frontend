<mat-dialog-content>
  <h3>Delete Application User</h3>

  <p>
    Are you sure you want to delete this user?
  </p>

  <p>
    <strong>Note:</strong> This action will deactivate the user and they will no longer appear in the active application user list.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="center">
  <button
      mat-raised-button
      color="warn"
      (click)="deleteAppUser(data.userId)">
      Delete
  </button>

  <button
      mat-button
      mat-dialog-close>
      Cancel
  </button>
</mat-dialog-actions>
