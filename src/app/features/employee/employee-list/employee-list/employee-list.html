<h1> {{employees.length}}</h1>
<table mat-table [dataSource]="employees" class="mat-elevation-z8">

    <!-- Employee ID -->
    <ng-container matColumnDef="employeeId">
        <th mat-header-cell *matHeaderCellDef>Employee ID</th>
        <td mat-cell *matCellDef="let employee">
            {{ employee.employeeId }}
        </td>
    </ng-container>

    <!-- Employee Number -->
    <ng-container matColumnDef="employeeNumber">
        <th mat-header-cell *matHeaderCellDef>Employee Number</th>
        <td mat-cell *matCellDef="let employee">
            {{ employee.employeeNumber }}
        </td>
    </ng-container>

    <!-- Employee Name -->
    <ng-container matColumnDef="employeeName">
        <th mat-header-cell *matHeaderCellDef>Employee Name</th>
        <td mat-cell *matCellDef="let employee">
            {{ employee.employeeName }}
        </td>
    </ng-container>

    <!-- Employee Email -->
    <ng-container matColumnDef="employeeEmail">
        <th mat-header-cell *matHeaderCellDef>Employee Email</th>
        <td mat-cell *matCellDef="let employee">
            {{ employee.employeeEmail }}
        </td>
    </ng-container>

    <!-- Phone Number -->
    <ng-container matColumnDef="employeePhoneNumber">
        <th mat-header-cell *matHeaderCellDef>Phone Number</th>
        <td mat-cell *matCellDef="let employee">
            {{ employee.employeePhoneNumber }}
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
